<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Distracted!</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f0f4f8;
        font-family: "Inter", Arial, sans-serif;
      }

      .card {
        max-width: 520px;
        text-align: center;
        background: #fff;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }

      #random-sentence {
        font-size: 1.75rem;
        color: #0f172a;
        margin-bottom: 16px;
      }

      #task-name {
        font-size: 1rem;
        color: #64748b;
        margin-bottom: 24px;
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 0.95rem;
        font-weight: 600;
      }

      #resume-btn {
        background: #0a99ff;
        color: white;
      }

      #view-task-btn {
        background: #edeff1;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="random-sentence"></div>
      <p id="task-name"></p>
      <div class="actions">
        <button id="resume-btn">Go back</button>
        <button id="view-task-btn" hidden>View my task</button>
      </div>
    </div>
    <script src="distracted.js"></script>
  </body>
</html>
