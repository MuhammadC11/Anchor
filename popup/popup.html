<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../shared/utils.js"></script>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="main.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter&family=Raleway:wght@300&family=Space+Grotesk:wght@300;400;500&display=swap");
    </style>
    <title>Anchor - My Tasks</title>
  </head>
  <body>
    <div class="container">
      <header class="header-container">
        <a href="./popup.html">
          <h3 class="header">Anchor</h3>
          <img
            id="home_icon"
            src="../assets/anchor.png"
            alt="Anchor Home Icon"
          />
        </a>

        <a
          href="../settings.html"
          class="settings-link"
          aria-label="Settings"
          title="Settings"
          >Settings</a
        >
      </header>

      <div id="api-key-banner" class="api-key-banner" hidden>
        <p>
          Add your Gemini API key in
          <a href="../settings.html">Settings</a> to enable AI features.
        </p>
      </div>

      <main>
        <div class="title-container">
          <h1 class="title">
            Let's drop the <span style="color: #0a99ff">hook.</span>
          </h1>
        </div>

        <div class="taskList"></div>

        <div class="button-container">
          <a
            class="btn link-btn"
            id="add-task-home"
            href="./AddTask/addTask.html"
            >Add a task</a
          >
        </div>
        <div class="button-container">
          <div id="clearTasks">
            <button class="btn" id="clearTasksBtn" type="button">
              Clear all tasks
            </button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
